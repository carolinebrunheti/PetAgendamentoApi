spring.application.name=Agendamento
spring.config.import=optional:file:.env[.properties]
server.port=8082

# Seguranca: MESMO segredo usado pelo petServices para assinar o token (HS256).
# Precisa ser identico nos dois servicos, senao a assinatura nao bate. Vem do .env / variavel JWT_SECRET.
jwt.secret=${JWT_SECRET}

# Banco
spring.datasource.url=jdbc:postgresql://localhost:5432/agendamento_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka - consumer
spring.kafka.consumer.group-id=petservices-agendamento
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer: um evento que nao desserializa vai para a DLT em vez de travar o consumidor
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.consulta.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Kafka - producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# max.block.ms: tempo maximo que o send() pode travar a thread HTTP esperando metadata/buffer
# (padrao 60000). Com o Kafka fora, falha em 5 s em vez de 60 s e nao esgota o pool de conexoes.
spring.kafka.producer.properties.max.block.ms=5000
# open-in-view=false: a conexao com o banco e devolvida ao pool quando a transacao/consulta termina,
# e nao so no fim da requisicao HTTP (evita segurar conexao enquanto o send() do Kafka espera).
spring.jpa.open-in-view=false
# listagens paginadas (?page=0&size=10&sort=campo,desc): 10 por pagina por padrao, no maximo 50
spring.data.web.pageable.max-page-size=50
