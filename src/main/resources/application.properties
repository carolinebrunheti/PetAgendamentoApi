spring.application.name=Agendamento
spring.config.import=optional:file:.env[.properties]
server.port=8082
server.error.include-message=always

# Banco
spring.datasource.url=jdbc:postgresql://localhost:5432/agendamento_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka - consumer
spring.kafka.consumer.group-id=petservices-agendamento
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.consulta.*

# Kafka - producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer